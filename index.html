    /* ================= app ================= */

    function WeeklyPlanner() {
      const [loaded, setLoaded] = useState(false);
      /* MỘT state điều hướng duy nhất cho khu giữa */
      const [view, setView] = useState("canvas");      // kanban | canvas | stats | archive
      const [leftOpen, setLeftOpen] = useState(true);
      const [rightOpen, setRightOpen] = useState(false);
      const [weekOffset, setWeekOffset] = useState(0);
      const [projects, setProjects] = useState([]);
      const [archive, setArchive] = useState([]);
      const [planClip, setPlanClip] = useState(null);
      const [themeId, setThemeId] = useState("cherry");
      const [lang, setLang] = useState("vi");
      const [sound, setSound] = useState(false);
      const [owned, setOwned] = useState({ fitness: true, study: false, meals: false, focus: true, journal: false, auto: false });
      const [addingProject, setAddingProject] = useState(false);
      const [newProject, setNewProject] = useState("");
      const [saveStatus, setSaveStatus] = useState("saved");
      const [confirmEnd, setConfirmEnd] = useState(false);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [showQr, setShowQr] = useState(false);
      const [contactOpen, setContactOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [taskRef, setTaskRef] = useState(null);     // { pid, tid, slotId? } — modal chi tiết
      const [colorLabels, setColorLabels] = useState(() => defaultColorLabels("vi"));
      const toastTimer = useRef(null);

      const C = THEMES.find((x) => x.id === themeId) || THEMES[0];
      const K = C.onCard;
      const t = useCallback((k) => (STR[lang] && STR[lang][k]) || STR.en[k] || k, [lang]);

      /* load */
      useEffect(() => {
        (async () => {
          const s = await loadState();
          if (s) {
            const norm = (s.projects || []).map((p) => ({
              ...p,
              tasks: (p.tasks || []).map((tk) => {
                const base = { start: DEFAULT_START, dur: DEFAULT_DUR, desc: "", color: null, ...tk };
                /* dữ liệu cũ dùng days[]: đổi mỗi ngày thành một slot riêng */
                const slots = base.slots
                  ? base.slots
                  : (base.days || []).map((d) => ({
                      slotId: uid(), day: d, start: base.start, dur: base.dur,
                      done: !!base.done, color: base.color || null, desc: "",
                    }));
                delete base.days;
                return {
                  ...base,
                  slots,
                  status: tk.status !== undefined ? tk.status : (tk.done ? "done" : null),
                };
              }),
            }));
            setProjects(norm);
            setArchive(s.archive || []);
            setPlanClip(s.planClip || null);
            if (s.themeId && THEMES.some((x) => x.id === s.themeId)) setThemeId(s.themeId);
            if (s.lang) setLang(s.lang);
            if (typeof s.sound === "boolean") setSound(s.sound);
            if (s.owned) setOwned(s.owned);
            if (["kanban", "canvas", "stats", "archive"].includes(s.view)) setView(s.view);
            if (s.colorLabels) setColorLabels({ ...defaultColorLabels(s.lang || "vi"), ...s.colorLabels });
            else setColorLabels(defaultColorLabels(s.lang || "vi"));
            if (typeof s.leftOpen === "boolean") setLeftOpen(s.leftOpen);
          }
          setLoaded(true);
        })();
      }, []);

      /* autosave */
      useEffect(() => {
        if (!loaded) return;
        setSaveStatus("saving");
        const tm = setTimeout(async () => {
          await saveState({ projects, archive, planClip, themeId, lang, sound, owned, view, leftOpen, colorLabels });
          setSaveStatus("saved");
        }, 500);
        return () => clearTimeout(tm);
      }, [projects, archive, planClip, themeId, lang, sound, owned, view, leftOpen, colorLabels, loaded]);

      useEffect(() => { document.body.style.background = C.bg; document.documentElement.style.background = C.bg; }, [C.bg]);

      /* QR chào tạm biệt: chỉ bắt khi con trỏ rời qua CẠNH TRÊN cửa sổ
         (thanh địa chỉ / nút đóng). Trước đây bắt mọi hướng nên bật cả
         lúc người dùng chỉ chuyển sang cửa sổ khác. */
      useEffect(() => {
        const out = (e) => { if (e.clientY <= 0 && !e.relatedTarget) setShowQr(true); };
        document.addEventListener("mouseout", out);
        return () => document.removeEventListener("mouseout", out);
      }, []);

      const showToast = useCallback((msg) => {
        setToast(msg);
        if (toastTimer.current) clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 2600);
      }, []);

      useEffect(() => {
        if (!confirmEnd) return;
        const tm = setTimeout(() => setConfirmEnd(false), 4000);
        return () => clearTimeout(tm);
      }, [confirmEnd]);

      /* đóng panel AI bằng phím Esc */
      useEffect(() => {
        const esc = (e) => {
          if (e.key !== "Escape") return;
          setTaskRef(null); setRightOpen(false);
        };
        window.addEventListener("keydown", esc);
        return () => window.removeEventListener("keydown", esc);
      }, []);

      const weekStart = useMemo(() => startOfWeek(weekOffset), [weekOffset]);
      const weekLabel = fmtRange(weekStart, lang);
      const hour = new Date().getHours();
      const greeting = hour < 12 ? t("greetM") : hour < 18 ? t("greetA") : t("greetE");

      /* ---- MỘT nguồn dữ liệu, làm phẳng một lần rồi chia cho 2 lăng kính ---- */
      const rows = useMemo(
        () => projects.flatMap((p) => p.tasks.map((tk) => ({ task: tk, pid: p.id, pname: p.name }))),
        [projects]
      );
      const inbox = useMemo(() => rows.filter((x) => isInInbox(x.task)), [rows]);
      const isBlank = projects.length === 0;

      /* Timetable đọc từng SLOT, không đọc Task */
      const slotRows = useMemo(
        () => rows.flatMap((r) => slotsOf(r.task).map((sl) => ({ ...r, slot: sl }))),
        [rows]
      );

      /* Đơn vị tiến độ: mỗi buổi trên lịch là 1 đơn vị; task chưa lên lịch
         cũng tính 1 đơn vị. Nhờ vậy tick 1 trong 3 buổi chỉ nhích 1/3. */
      const unscheduled = rows.filter((x) => slotsOf(x.task).length === 0);
      const totalUnits = slotRows.length + unscheduled.length;
      const doneUnits = slotRows.filter((x) => x.slot.done).length + unscheduled.filter((x) => x.task.done).length;
      const pct = totalUnits ? Math.round((doneUnits / totalUnits) * 100) : 0;

      const chart = useMemo(() => ([
        { label: t("backlog"), color: BACKLOG_COLOR, value: rows.filter((x) => !x.task.status).length },
        ...STATUS.map((s) => ({ label: s.label, color: s.color, value: rows.filter((x) => x.task.status === s.id).length })),
      ]), [rows, t]);

      /* ---- thao tác trên Task: mọi lăng kính đều gọi vào đây ---- */
      const patchTask = (pid, tid, fn) =>
        setProjects((prev) => prev.map((p) => (p.id !== pid ? p : { ...p, tasks: p.tasks.map((x) => (x.id !== tid ? x : fn(x))) })));

      const addProject = (name) => setProjects((prev) => [...prev, { id: uid(), name, tasks: [] }]);
      const submitNewProject = () => {
        const name = newProject.trim();
        if (!name) return;
        addProject(name);
        setNewProject("");
        setAddingProject(false);
      };
      const deleteProject = (pid) => setProjects((prev) => prev.filter((p) => p.id !== pid));
      const addTask = (pid, name) =>
        setProjects((prev) => prev.map((p) => (p.id === pid ? { ...p, tasks: [...p.tasks, { id: uid(), name, done: false, slots: [], status: null, start: DEFAULT_START, dur: DEFAULT_DUR, desc: "", color: null }] } : p)));
      const deleteTask = (pid, tid) =>
        setProjects((prev) => prev.map((p) => (p.id === pid ? { ...p, tasks: p.tasks.filter((x) => x.id !== tid) } : p)));

      /* Canvas tick xong  →  Kanban tự nhảy sang Done */
      const toggleTask = (pid, tid) =>
        patchTask(pid, tid, (x) => {
          const nd = !x.done;
          if (nd && sound) blip();
          return {
            ...x,
            done: nd,
            status: nd ? "done" : (x.status === "done" ? "todo" : x.status),
            slots: slotsOf(x).map((sl) => ({ ...sl, done: nd })),
          };
        });

      /* Kanban kéo sang Done  →  Canvas tự gạch ngang */
      /* Kanban kéo sang Done → cả việc xong, mọi buổi của nó cũng gạch ngang */
      const setStatus = (pid, tid, st) =>
        patchTask(pid, tid, (x) => {
          const nd = st === "done";
          if (nd && !x.done && sound) blip();
          return { ...x, status: st, done: nd, slots: slotsOf(x).map((sl) => ({ ...sl, done: nd })) };
        });

      /* ---- SLOT: sinh, dời, sửa, xoá. Mỗi slot sống độc lập. ---- */
      const patchSlot = (pid, tid, slotId, fn) =>
        patchTask(pid, tid, (x) => ({ ...x, slots: slotsOf(x).map((sl) => (sl.slotId === slotId ? fn(sl) : sl)) }));

      /* Thả từ Hộp việc vào lưới giờ → TẠO MỘT SLOT MỚI rồi mở modal của slot đó */
      const addSlot = (pid, tid, day, mins, openIt) => {
        let created = null;
        patchTask(pid, tid, (x) => {
          created = newSlot(x, day, mins);
          return { ...x, slots: [...slotsOf(x), created], status: x.status || "todo" };
        });
        if (openIt && created) setTaskRef({ pid, tid, slotId: created.slotId });
      };

      /* Kéo một khối sang ngày khác / mốc giờ khác — chỉ đổi slot đó */
      const moveSlot = (pid, tid, slotId, toDay, mins) =>
        patchSlot(pid, tid, slotId, (sl) => ({ ...sl, day: toDay, start: clampStart(mins) }));

      const deleteSlot = (pid, tid, slotId) =>
        patchTask(pid, tid, (x) => ({ ...x, slots: slotsOf(x).filter((sl) => sl.slotId !== slotId) }));

      /* Tick một buổi: chỉ buổi đó đổi. Nhưng nếu MỌI buổi đã xong thì Task
         gốc cũng chuyển Done trên Kanban — và ngược lại. */
      const toggleSlotDone = (pid, tid, slotId) =>
        patchTask(pid, tid, (x) => {
          const slots = slotsOf(x).map((sl) => (sl.slotId === slotId ? { ...sl, done: !sl.done } : sl));
          const justDone = slots.find((sl) => sl.slotId === slotId).done;
          if (justDone && sound) blip();
          const all = slots.length > 0 && slots.every((sl) => sl.done);
          return {
            ...x,
            slots,
            done: all,
            status: all ? "done" : (x.status === "done" ? "wip" : x.status || "todo"),
          };
        });

      /* Trả về Inbox: xoá sạch cả hai lăng kính */
      const unassign = (pid, tid) =>
        patchTask(pid, tid, (x) => ({ ...x, status: null, slots: [], done: false }));

      const copyPlan = () => {
        if (projects.length === 0) { showToast(t("tNoCopy")); return; }
        const plan = projects.map((p) => ({ name: p.name, tasks: p.tasks.map((x) => ({ name: x.name, start: x.start, dur: x.dur, desc: x.desc || "", color: x.color || null, slots: slotsOf(x).map((sl) => ({ day: sl.day, start: sl.start, dur: sl.dur, color: sl.color || null, desc: sl.desc || "" })) })) }));
        setPlanClip(plan);
        try { navigator.clipboard.writeText(JSON.stringify(plan, null, 2)); } catch (e) {}
        showToast(t("tCopied"));
      };
      const pastePlan = () => {
        if (!planClip) { showToast(t("tNoPaste")); return; }
        const cloned = planClip.map((p) => ({
          id: uid(),
          name: p.name,
          tasks: p.tasks.map((x) => ({ id: uid(), name: x.name, done: false, status: null, start: x.start ?? DEFAULT_START, dur: x.dur ?? DEFAULT_DUR, desc: x.desc || "", color: x.color || null, slots: (x.slots || []).map((sl) => ({ ...sl, slotId: uid(), done: false })) })),
        }));
        setProjects((prev) => [...prev, ...cloned]);
        showToast(t("tPasted"));
      };

      const endWeek = () => {
        if (totalUnits === 0) { showToast(t("tNoArchive")); setConfirmEnd(false); return; }
        /* ghi đúng nhãn tuần ĐANG XEM, không phải lúc nào cũng tuần hiện tại */
        setArchive((prev) => [...prev, { id: uid(), label: weekLabel, endedAt: Date.now(), done: doneUnits, total: totalUnits, pct }]);
        setProjects((prev) => prev.map((p) => ({ ...p, tasks: p.tasks.map((x) => ({ ...x, done: false, slots: [], status: null })) })));
        setConfirmEnd(false);
        setWeekOffset(0);
        showToast(t("tArchived"));
      };

      /* Modal chỉ giữ id, entry luôn được dựng lại từ `rows` để nội dung
         trong modal cập nhật ngay khi state đổi. */
      const findRow = (ref) => (ref ? rows.find((r) => r.pid === ref.pid && r.task.id === ref.tid) : null);
      const baseRow = findRow(taskRef);
      const taskEntry = baseRow
        ? (taskRef.slotId
            ? (slotsOf(baseRow.task).find((sl) => sl.slotId === taskRef.slotId)
                ? { ...baseRow, slot: slotsOf(baseRow.task).find((sl) => sl.slotId === taskRef.slotId) }
                : null)
            : baseRow)
        : null;

      const ctxValue = useMemo(() => ({ C, t, lang }), [C, t, lang]);

      return (
        <Ctx.Provider value={ctxValue}>
          {/* Khung app-shell: đúng bằng 100vh/100vw, overflow-hidden cả hai
              trục — trang KHÔNG BAO GIỜ tự cuộn. Các khu tự cuộn (sidebar,
              cột Kanban, lưới Canvas, panel AI) đều có overflow-y/x-auto
              RIÊNG lồng bên trong, không bị ảnh hưởng bởi khoá này. */}
          <div className="wp-root min-h-screen w-full flex flex-col lg:h-screen lg:overflow-hidden" style={{ background: C.bg, color: "var(--ink)" }}>
            <style>{`
              /* Hai tầng bề mặt: .wp-root/.on-bg = chữ trên NỀN, .on-card = chữ trong Ô */
              .wp-root, .on-bg {
                --ink:${C.ink}; --sub:${C.sub}; --faint:${C.faint};
                --line:${C.line}; --dash:${C.dash};
                --accent:${C.accent}; --accentFill:${C.accentFill}; --accentSoft:${C.accentSoft}; --accentInk:${C.accentInk};
              }
              .on-card {
                --ink:${K.ink}; --sub:${K.sub}; --faint:${K.faint};
                --line:${K.line}; --dash:${K.dash};
                --accent:${K.accent}; --accentFill:${K.accentFill}; --accentSoft:${K.accentSoft}; --accentInk:${K.accentInk};
              }
              ::selection { background: var(--accentSoft); }
              input::placeholder { color: var(--faint); }
              option { color: #1a1a1a; background: #fff; }
              *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
              @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
            `}</style>

            <div className="max-w-[1600px] mx-auto w-full flex-1 lg:min-h-0 flex flex-col">
              {/* ---------- HÀNG TRÊN CÙNG ----------------------------------------
                   Hai tầng, cùng nằm trên đường kẻ ngang cuối header:
                     tầng 1 — ngày tháng (trái) · LOGO (giữa) · nút (phải)
                     tầng 2 — cục pin, căn giữa
                   Logo giữ đúng giữa nhờ hai ô hai bên cùng `flex-1 basis-0`:
                   basis-0 bắt chúng chia đều phần rộng BẤT KỂ nội dung bên
                   trong dài ngắn khác nhau (ngày tháng vs 2 nút), nên logo
                   không bị đẩy lệch — cố định theo cấu trúc, không cần đo JS.
                   Màn hẹp (<sm) thì logo về hàng riêng, hai bên tự xuống dòng.
                   ------------------------------------------------------------------ */}
              <header className="shrink-0 px-4 md:px-8 pt-2 pb-3 border-b" style={{ borderColor: "var(--line)" }}>
                <div className="flex flex-wrap sm:flex-nowrap items-center justify-center gap-x-4 gap-y-2">
                  {/* Dưới sm: chiếm trọn một dòng riêng, căn giữa — để chung
                      dòng với 2 nút thì "Chủ Nhật, 16 tháng 8" + CHỐT TUẦN +
                      ĐĂNG KÝ ~350px không vừa màn 375px và đâm vào nhau. */}
                  <span className="w-full sm:w-auto sm:flex-1 sm:basis-0 min-w-0 order-2 sm:order-1 flex justify-center sm:justify-start">
                    <span className="ff-display text-[15px] sm:text-[17px] lg:text-[20px] leading-[1.25] u-ink">
                      {todayLabel(lang)}
                    </span>
                  </span>

                  <button
                    onClick={() => setView("canvas")}
                    aria-label="ARVIS"
                    className="flex items-end gap-[6px] sm:gap-[10px] select-none leading-none shrink-0 order-1 sm:order-2 w-full sm:w-auto justify-center"
                    style={{ color: "var(--ink)" }}
                  >
                    <span className="brand-mark block w-[42px] h-[32px] sm:w-[52px] sm:h-[39px] lg:w-[60px] lg:h-[45px]" />
                    <span className="brand-word block w-[97px] h-[17px] sm:w-[120px] sm:h-[21px] lg:w-[138px] lg:h-[24px] mb-[2px] lg:mb-[3px]" />
                    <span className="block w-[5px] h-[5px] lg:w-[7px] lg:h-[7px] rounded-full mb-[4px] lg:mb-[5px]" style={{ background: "var(--accent)" }} />
                  </button>

                  <span className="w-full sm:w-auto sm:flex-1 sm:basis-0 min-w-0 order-3 flex items-center justify-center sm:justify-end gap-3 sm:gap-4">
                    {confirmEnd ? (
                      <span className="flex items-center gap-2">
                        <button onClick={endWeek} className="flex items-center gap-1 rounded-full px-3 py-1 u-label whitespace-nowrap" style={{ background: "var(--accentFill)", color: "var(--accentInk)" }}>
                          <Icons.Check width={12} height={12} /> {t("archiveReset")}
                        </button>
                        <button onClick={() => setConfirmEnd(false)} style={{ color: "var(--faint)" }}><Icons.X width={14} height={14} /></button>
                      </span>
                    ) : (
                      <button onClick={() => setConfirmEnd(true)} className="flex items-center gap-1 u-label transition-colors u-sub whitespace-nowrap">
                        <Icons.Refresh width={12} height={12} /> {t("endWeek")}
                      </button>
                    )}

                    <button
                      onClick={() => setContactOpen((v) => !v)}
                      className="rounded-full border px-3 py-1 u-label transition-colors whitespace-nowrap"
                      style={{ borderColor: "var(--line)", color: contactOpen ? "var(--accent)" : "var(--sub)" }}
                    >
                      {t("signup")}
                    </button>
                  </span>
                </div>
              </header>

              {/* ---------- 3 khu vực ---------- */}
              <div className="flex-1 lg:min-h-0 flex flex-col lg:flex-row items-stretch gap-0 lg:gap-5 px-4 md:px-8 py-5">
                {/* CỘT TRÁI — nhập liệu. overflow-hidden ngoài dành riêng cho
                    animation thu/mở bề rộng — cuộn dọc đặt ở khối BÊN TRONG
                    (h-full overflow-y-auto) để không xung đột với animation. */}
                <aside
                  className={"shrink-0 overflow-hidden transition-all duration-300 " + (leftOpen ? "w-full lg:w-[330px] mb-5 lg:mb-0" : "w-0 h-0 lg:h-auto")}
                  aria-hidden={!leftOpen}
                >
                  <div className="lg:h-full lg:overflow-y-auto">
                  <LeftSidebar
                    projects={projects}
                    inbox={inbox}
                    addingProject={addingProject} setAddingProject={setAddingProject}
                    newProject={newProject} setNewProject={setNewProject}
                    submitNewProject={submitNewProject}
                    onAddTask={addTask}
                    onDeleteTask={deleteTask}
                    onDeleteProject={deleteProject}
                    onCopy={copyPlan}
                    onPaste={pastePlan}
                    onStatus={setStatus}
                    onDay={(pid, tid, d) => addSlot(pid, tid, d, null, false)}
                    onUnassign={unassign}
                    onDetails={(x) => setTaskRef({ pid: x.pid, tid: x.task.id })}
                  />
                  </div>
                </aside>

                {/* KHU GIỮA — workspace, không có ô nhập liệu nào.
                    flex-col + min-h-0: WorkspaceHeader (tab Kanban/Canvas...)
                    cố định chiều cao (shrink-0), phần nội dung bên dưới
                    flex-1 min-h-0 overflow-hidden để CHIẾM TRỌN không gian
                    còn lại — cuộn thật sự chỉ xảy ra bên trong từng view
                    (cột Kanban, lưới Canvas...), không phải ở khối này. */}
                <main className="flex-1 min-w-0 lg:min-h-0 flex flex-col">
                  {/* WorkspaceHeader vẽ ở MỌI trạng thái. Trước đây nó nằm trong
                      nhánh else của `projects.length === 0`, nên người dùng mới
                      chưa có dự án sẽ không thấy tab Kanban/Canvas/Stats/Archive
                      nào cả — tính năng có trong code mà không có đường vào. */}
                  <div className="shrink-0">
                    <WorkspaceHeader view={view} setView={setView} leftOpen={leftOpen} setLeftOpen={setLeftOpen} />
                  </div>
                  <div className="lg:flex-1 lg:min-h-0 lg:overflow-hidden">
                  {isBlank && (view === "kanban" || view === "canvas") ? (
                    <div className="lg:h-full lg:overflow-y-auto">
                      <WelcomeCard greeting={greeting} onStart={() => { setLeftOpen(true); setAddingProject(true); }} />
                    </div>
                  ) : (
                    <>
                      {view === "kanban" && (
                        <KanbanView
                          rows={rows}
                          chart={chart}
                          onSetStatus={setStatus}
                          onDetails={(x) => setTaskRef({ pid: x.pid, tid: x.task.id })}
                        />
                      )}
                      {view === "canvas" && (
                        <CanvasView
                          slotRows={slotRows}
                          isCurrentWeek={weekOffset === 0}
                          onAssignSlot={(pid, tid, day, mins) => addSlot(pid, tid, day, mins, true)}
                          onMoveSlot={moveSlot}
                          onToggleSlotDone={toggleSlotDone}
                          onOpen={(x) => setTaskRef({ pid: x.pid, tid: x.task.id, slotId: x.slot.slotId })}
                        />
                      )}
                      {view === "stats" && (
                        <div className="lg:h-full lg:overflow-y-auto">
                          <StatsView projects={projects} archive={archive} />
                        </div>
                      )}
                      {view === "archive" && (
                        <div className="lg:h-full lg:overflow-y-auto">
                          <ArchiveView archive={archive} onDelete={(id) => setArchive((prev) => prev.filter((w) => w.id !== id))} />
                        </div>
                      )}
                    </>
                  )}
                  </div>
                </main>

                {/* CỘT PHẢI — AI */}
                <AiDock
                  open={rightOpen}
                  setOpen={setRightOpen}
                  owned={owned}
                  onToggle={(id) => { setOwned((o) => ({ ...o, [id]: !o[id] })); showToast(t("tToolTgl")); }}
                  onConnect={() => showToast(t("tModule"))}
                />
              </div>

              {/* cục pin — ngay dưới khu bảng, phía trên đường kẻ ngang của
                  footer. Đệm trên/dưới BẰNG NHAU (py-6) để nó nằm đúng giữa
                  khoảng cách từ chân bảng tới đường kẻ, không dính sát đáy. */}
              <div className="shrink-0 flex justify-center px-4 md:px-8 py-6">
                <ProgressTank pct={pct} done={doneUnits} total={totalUnits} />
              </div>

              {/* ---------- footer ---------- */}
              {/* Footer 3 cột trên máy để bàn. Màn hẹp bỏ lưới 3 cột (dồn
                  chữ đến vỡ) sang flex tự xuống dòng, điều hướng tuần đứng
                  trước vì đó là thứ hay bấm nhất. */}
              <footer className="shrink-0 border-t px-4 md:px-8 py-3 flex flex-wrap sm:grid sm:grid-cols-3 items-center justify-center gap-x-4 gap-y-2" style={{ borderColor: "var(--line)" }}>
                <div className="flex justify-start items-center gap-4 order-2 sm:order-1">
                  <GhostBtn label={<span className="ml-1">{t("settings")}</span>} icon={<span>⚙</span>} active={settingsOpen} onClick={() => setSettingsOpen((v) => !v)} />
                </div>

                <div className="flex items-center justify-center gap-1 order-1 sm:order-2 w-full sm:w-auto">
                  <button onClick={() => setWeekOffset((o) => o - 1)} style={{ color: "var(--sub)" }}>
                    <Icons.ChevronLeft width={16} height={16} />
                  </button>
                  <span className="ff-display text-[18px] sm:text-[21px] lg:text-[24px] px-2 select-none whitespace-nowrap">{weekLabel}</span>
                  <button onClick={() => setWeekOffset((o) => o + 1)} style={{ color: "var(--sub)" }}>
                    <Icons.ChevronRight width={16} height={16} />
                  </button>
                  {weekOffset === 0 ? (
                    <Micro className="ml-2 px-2 py-1 rounded-full hidden sm:inline" style={{ background: "var(--accentSoft)", color: "var(--accent)" }}>{t("thisWeek")}</Micro>
                  ) : (
                    <button
                      onClick={() => setWeekOffset(0)}
                      className="ml-2 u-label underline underline-offset-4 transition-opacity hover:opacity-80"
                      style={{ color: "var(--accent)" }}
                    >
                      {t("thisWeek")}
                    </button>
                  )}
                </div>

                <div className="flex justify-end items-center gap-1 u-label select-none min-w-0 u-sub order-3">
                  <span
                    className={`w-1 h-1 rounded-full ${saveStatus === "saving" ? "animate-pulse" : ""}`}
                    style={{ background: saveStatus === "saving" ? "var(--accent)" : "#5f7d5a" }}
                  />
                  <span className="hidden md:inline">{saveStatus === "saving" ? t("saving") : t("savedLocally")}</span>
                  <span className="ml-2 opacity-70">{BUILD}</span>
                </div>
              </footer>
            </div>

            <SettingsPopover
              open={settingsOpen}
              onClose={() => setSettingsOpen(false)}
              sound={sound} setSound={setSound}
              themeId={themeId} setThemeId={setThemeId}
              lang={lang} setLang={setLang}
              colorLabels={colorLabels} setColorLabels={setColorLabels}
            />
            <QrPopup show={showQr} onClose={() => setShowQr(false)} />
            <ContactPopover open={contactOpen} onClose={() => setContactOpen(false)} showToast={showToast} />

            <TaskModal
              entry={taskEntry}
              colorLabels={colorLabels}
              onClose={() => setTaskRef(null)}
              onRenameTask={(name) => patchTask(taskRef.pid, taskRef.tid, (x) => ({ ...x, name }))}
              onPatchTask={(o) => patchTask(taskRef.pid, taskRef.tid, (x) => ({ ...x, ...o }))}
              onPatchSlot={(o) => patchSlot(taskRef.pid, taskRef.tid, taskRef.slotId, (sl) => ({ ...sl, ...o }))}
              onToggleTaskDone={() => toggleTask(taskRef.pid, taskRef.tid)}
              onToggleSlotDone={(sid) => toggleSlotDone(taskRef.pid, taskRef.tid, sid)}
              onAddSlot={(d) => addSlot(taskRef.pid, taskRef.tid, d, null, false)}
              onMoveSlotDay={(d) => patchSlot(taskRef.pid, taskRef.tid, taskRef.slotId, (sl) => ({ ...sl, day: d }))}
              onDeleteSlot={(sid) => { deleteSlot(taskRef.pid, taskRef.tid, sid); if (taskRef.slotId === sid) setTaskRef(null); }}
              onDeleteTask={() => { deleteTask(taskRef.pid, taskRef.tid); setTaskRef(null); }}
              onOpenSlot={(sid) => setTaskRef({ ...taskRef, slotId: sid })}
              onAiTrigger={() => showToast(t("tAiTrigger"))}
            />

            {toast && (
              <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-[60] rounded-full px-5 py-2.5 text-[16px] font-medium shadow-lg max-w-md text-center transition-all" style={{ background: "var(--ink)", color: C.bg }}>
                {toast}
              </div>
            )}
          </div>
        </Ctx.Provider>
      );
    }


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<WeeklyPlanner />);
  </script>
</body>
</html>

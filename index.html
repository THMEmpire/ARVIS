  <style>
    /* ------------------------------------------------------------------
       NGUYÊN NHÂN LỖI VỠ DẤU (đã sửa ở v13)
       Tailwind Play CDN chèn stylesheet của nó vào CUỐI <head>, tức là SAU
       khối <style> này. Class `.font-serif` của Tailwind có cùng độ ưu tiên
       nhưng đứng sau nên luôn thắng, và nó trỏ vào:
           ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif
       `ui-serif`/`Georgia` thiếu glyph dựng sẵn cho ế ầ ấ ề → trình duyệt
       tự tách thành nguyên âm + dấu rời rồi vẽ dấu như một ký tự đứng riêng.
       Đó là lý do mọi lần đổi font trước đây đều vô hiệu: chúng ta sửa một
       rule không bao giờ được áp dụng.
       Cách chặn: đặt tên class riêng (`ff-display`) mà Tailwind không sinh ra.
       ------------------------------------------------------------------ */
    :root {
      /* Be Vietnam Pro do một xưởng chữ Việt dựng, bộ dấu đầy đủ nhất trong
         các font miễn phí. Playfair Display có subset `vietnamese` chính thức.
         Font hệ thống đứng sau chỉ để đỡ lúc mạng chậm, chưa kịp tải webfont. */
      --ff-body: 'Be Vietnam Pro', Arial, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --ff-display: 'Playfair Display', 'Times New Roman', Tinos, 'Liberation Serif', serif;
      /* Chữ thứ ba dành riêng cho nhãn viết hoa: IBM Plex Mono, cũng có
         subset `vietnamese`. Mono đặt cạnh Playfair tạo tương phản kiểu
         tạp chí/gallery, khác hẳn thân chữ nên nhãn không bị lẫn vào nội dung. */
      --ff-label: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
      /* Bề rộng cột lưới Canvas — CANVAS_COLS trong JS đọc hai biến này.
         Khai ở đây để một chỗ sửa là mọi nền tảng đổi theo. */
      --day-col: 148px;
      --hour-col: 58px;
    }
    /* Tablet: cột hẹp lại để cả tuần vừa khung, đỡ phải cuộn ngang */
    @media (max-width: 1024px) { :root { --day-col: 112px; --hour-col: 50px; } }
    /* Điện thoại: hẹp nhất còn đọc được. --hour-col phải chứa trọn "00:00"
       (~33px ở 12.5px) cộng khoảng thở hai bên, 44px làm chữ chạm sát mép. */
    @media (max-width: 640px)  { :root { --day-col: 84px;  --hour-col: 54px; } }
    /* Mọi nhãn viết hoa trong app đều đi qua class `uppercase` của Tailwind.
       Tailwind chỉ đặt `text-transform` ở đó, nên gán font-family tại đây
       không xung đột và phủ được toàn bộ nhãn chỉ bằng một dòng. */
    .uppercase { font-family: var(--ff-label); }
    /* Một class thay cho chuỗi 6 utility bị lặp ở 16 chỗ.
       Tự mang luôn font nhãn nên không cần kèm `uppercase` nữa. */
    /* Vạch 25% kiểu cục pin: nét ĐỨT (border-left dashed), không phải
       thanh liền — viền ngoài của bể mới là nét đậm, vạch này phải nhạt
       và mảnh hơn hẳn để rõ tôn ti: viền > vạch chia > số phần trăm. */
    /* Chừa mép theo TỈ LỆ (14%) thay vì số px cố định — thanh pin thấp hơn
       trên điện thoại, chốt 9px cứng làm vạch gần chạm viền trên/dưới. */
    .tank-divider {
      position: absolute; top: 14%; bottom: 14%; width: 0;
      border-left: 2px dashed rgba(255, 255, 255, .6);
      pointer-events: none;
    }
    .u-on-fill { color: #ffffff; text-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
    /* Bốn lớp màu chữ thay cho `style={{ color: "var(--x)" }}` lặp khắp file.
       Tên có tiền tố u- nên chắc chắn không đụng utility nào của Tailwind. */
    .u-ink    { color: var(--ink); }
    .u-sub    { color: var(--sub); }
    .u-faint  { color: var(--faint); }
    .u-accent { color: var(--accent); }
    .u-label {
      font-family: var(--ff-label);
      text-transform: uppercase;
      font-size: 14.5px;
      letter-spacing: 0.11em;
      font-weight: 600;
      line-height: 1.7;
      white-space: nowrap;
    }
    /* Tailwind Play CDN không phát sinh line-clamp cho mọi cấu hình,
       nên khai tay để chắc chắn tiêu đề task luôn bị giới hạn dòng. */
    .line-clamp-1, .line-clamp-2, .line-clamp-3 {
      display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
    }
    .line-clamp-1 { -webkit-line-clamp: 1; }
    .line-clamp-2 { -webkit-line-clamp: 2; }
    .line-clamp-3 { -webkit-line-clamp: 3; }
    /* MẶC ĐỊNH (điện thoại/tablet): trang cuộn BÌNH THƯỜNG.
       Các khối xếp chồng dọc (hộp việc → bảng → pin → footer) không thể
       nhồi vừa một màn hình cao 100vh — ép vào là khu bảng chỉ còn ~200px,
       xem không nổi. Ngoài ra 100vh trên trình duyệt di động còn bị tính
       sai vì thanh địa chỉ trượt ra/vào. */
    html, body {
      margin: 0; padding: 0;
      width: 100%;
      overflow-x: hidden;
    }
    /* CHỈ TỪ 1024px (máy tính): khoá khung đúng viewport, không cho trang
       tự cuộn — cuộn chỉ xảy ra bên trong sidebar / cột Kanban / lưới
       Canvas, mỗi khối có overflow-y-auto riêng. */
    @media (min-width: 1024px) {
      html, body { height: 100vh; overflow: hidden; }
    }
    body {
      font-family: var(--ff-body);
      line-height: 1.62;
    }
    .ff-display {
      font-family: var(--ff-display);
      font-weight: 600;              /* Playfair nét 400-500 còn mảnh, 600 mới có sức nặng */
      letter-spacing: -0.012em;
      line-height: 1.3;
    }
    /* ---- Thương hiệu ARVIS ----------------------------------------------
       Logo được tách nền và dùng làm CSS mask, tô bằng currentColor nên nó
       tự đổi màu theo từng theme thay vì mang theo nền teal cố định. -------- */
    .brand-mark, .brand-word {
      background-color: currentColor;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center;  mask-position: center;

    const DAYS = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

    const dayName = (i, lang) => (lang === "vi" ? DAY_VI : DAYS)[i];
    const MONTHS_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const MONTHS_VI = ["Thg 1","Thg 2","Thg 3","Thg 4","Thg 5","Thg 6","Thg 7","Thg 8","Thg 9","Thg 10","Thg 11","Thg 12"];

    /* ---- Trục thời gian của Timetable ---- */
    /* Đủ 24 giờ: trước đây cắt 6:00–23:00 nên việc rơi vào đêm/rạng sáng
       (23h–6h) không có chỗ đặt. Giờ 0:00–23:59 đều xếp được. */
    const HOUR_START = 0;                 // lưới bắt đầu 0:00
    const HOUR_END = 23;                  // ô cuối là 23:00–24:00
    const ROW_H = 46;                     // chiều cao 1 giờ, tính bằng px
    const HOURS = Array.from({ length: HOUR_END - HOUR_START + 1 }, (_, i) => HOUR_START + i);
    const DEFAULT_START = 9 * 60;         // 09:00
    const DEFAULT_DUR = 60;               // 60 phút
    const clampStart = (m) => Math.max(HOUR_START * 60, Math.min((HOUR_END + 1) * 60 - 15, m));
    /* Bề rộng cột lấy từ biến CSS (khai ở khối <style>, đổi theo cỡ màn):
       máy để bàn 148px, tablet 112px, điện thoại 84px. Dùng biến thay số
       cứng để một chỗ khai báo phủ mọi nền tảng; minmax giữ cột không hẹp
       hơn ngưỡng đó (rộng hơn khung thì cuộn ngang), còn 1fr cho cột giãn
       lấp đầy khi màn rộng. Không quay lại 1fr thuần — tên task dài sẽ kéo
       cột phình ra làm vỡ lưới 7 ngày. */
    const CANVAS_COLS = "var(--hour-col) repeat(7, minmax(var(--day-col), 1fr))";
    const hhmm = (mins) => String(Math.floor(mins / 60)).padStart(2, "0") + ":" + String(mins % 60).padStart(2, "0");
    const minsOf = (str) => { const [h, m] = String(str).split(":").map(Number); return (h || 0) * 60 + (m || 0); };

    /* Xếp làn cho các khối chồng giờ trong cùng một ngày:
       khối nào bắt đầu sau khi làn đó đã trống thì tái sử dụng làn cũ. */
    function layoutDay(items) {
      const sorted = [...items].sort((a, b) => a.slot.start - b.slot.start);
      const laneEnd = [];
      const placed = sorted.map((it) => {
        const st = it.slot.start;
        const en = it.slot.start + it.slot.dur;
        let li = laneEnd.findIndex((e) => e <= st);
        if (li === -1) { laneEnd.push(en); li = laneEnd.length - 1; }
        else laneEnd[li] = en;
        return { ...it, lane: li };
      });
      const lanes = Math.max(1, laneEnd.length);
      return placed.map((x) => ({ ...x, lanes }));
    }

    function startOfWeek(offset = 0) {
      const now = new Date();
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const dow = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - dow + offset * 7);
      return d;
    }
    function fmtRange(start, lang) {
      const M = lang === "vi" ? MONTHS_VI : MONTHS_EN;
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      const f = (dt) => `${dt.getDate()} ${M[dt.getMonth()]}`;
      return `${f(start)} – ${f(end)}`;
    }
    function todayLabel(lang) {
      const opt = { weekday: "long", day: "numeric", month: lang === "vi" ? "long" : "short" };
      return new Date().toLocaleDateString(lang === "vi" ? "vi-VN" : "en-GB", opt);
    }

    function blip() {
      try {
        const A = window.AudioContext || window.webkitAudioContext;
        const a = new A();
        const o = a.createOscillator();
        const g = a.createGain();
        o.type = "sine";
        o.frequency.value = 740;
        g.gain.setValueAtTime(0.12, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.14);
        o.connect(g); g.connect(a.destination);
        o.start(); o.stop(a.currentTime + 0.15);
      } catch (e) {}
    }

    const KEY = "planner.state.v1";
    async function loadState() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    }
    async function saveState(state) {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}

    function Donut({ data, centerLabel }) {
      const { C } = useApp();
      const total = data.reduce((s, d) => s + d.value, 0);
      const R = 42, CIRC = 2 * Math.PI * R;
      let acc = 0;
      return (
        <svg viewBox="0 0 120 120" className="w-32 h-32 mx-auto">
          <circle cx="60" cy="60" r={R} fill="none" style={{ stroke: "var(--line)" }} strokeWidth="14" />
          {total > 0 && data.filter((d) => d.value > 0).map((d) => {
            const frac = d.value / total;
            const dash = frac * CIRC;
            const off = -acc * CIRC;
            acc += frac;
            return (
              <circle
                key={d.label}
                cx="60" cy="60" r={R} fill="none"
                stroke={d.color} strokeWidth="14"
                strokeDasharray={`${dash} ${CIRC - dash}`}
                strokeDashoffset={off}
                transform="rotate(-90 60 60)"
              />
            );
          })}
          <text x="60" y="58" textAnchor="middle" fontSize="22" style={{ fill: "var(--ink)" }} className="ff-display">{total}</text>
          <text x="60" y="74" textAnchor="middle" fontSize="8" style={{ fill: "var(--sub)", letterSpacing: "2px", textTransform: "uppercase" }}>{centerLabel}</text>
        </svg>
      );

    function ContactPopover({ open, onClose, showToast }) {
      const { C, t } = useApp();
      const [email, setEmail] = useState("");
      const [fbText, setFbText] = useState("");
      const [fbEmail, setFbEmail] = useState("");
      if (!open) return null;

      const emailOk = EMAIL_RE.test(email.trim());

      /* viaGmail=true → mở khung soạn thư Gmail web ở TAB MỚI (không mất
         trang planner). false → mailto: dự phòng cho ai không dùng Gmail,
         mở trong chính tab hiện tại là bình thường vì trình duyệt giao
         việc đó cho hệ điều hành, không thực sự điều hướng khỏi trang. */
      const submitSignup = (viaGmail) => {
        if (!emailOk) { showToast(t("invalidEmail")); return; }
        const subject = t("mailSignupSubject"), body = t("mailSignupBody") + email.trim();

        setEmail("");
        showToast(t("tSignupSent"));
        onClose();
      };

        const text = fbText.trim();
        if (!text) return;
        const subject = t("mailFeedbackSubject");
        const body = text + (fbEmail.trim() ? "\n\n" + t("mailFeedbackReply") + fbEmail.trim() : "");

        else window.location.href = mailtoLink(subject, body);
        setFbText(""); setFbEmail("");
        showToast(t("tFeedbackSent"));
        onClose();

                  onChange={(e) => setEmail(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") submitSignup(true); }}
                  placeholder={t("emailPh")}
                  className="flex-1 min-w-0 rounded-lg border px-2 py-1.5 text-[15px] bg-transparent"
                  style={{ borderColor: "var(--line)", color: "var(--ink)" }}
                />
                <button
                  onClick={() => submitSignup(true)}
                  className="shrink-0 rounded-lg px-3 py-1.5 u-label transition-opacity"
                  style={{ background: "var(--accentFill)", color: "var(--accentInk)", opacity: emailOk ? 1 : 0.5 }}

      const pct = total ? Math.round((done / total) * 100) : 0;
      const allSlots = tasks.flatMap((x) => slotsOf(x));
      const dayCounts = DAYS.map((_, i) => allSlots.filter((sl) => sl.day === i).length);
      const max = Math.max(1, ...dayCounts);
      const busiest = dayCounts.some((c) => c > 0) ? dayName(dayCounts.indexOf(Math.max(...dayCounts)), lang) : null;
      const dist = [
        { label: t("backlog"), color: BACKLOG_COLOR, value: tasks.filter((x) => !x.status).length },
        ...STATUS.map((st) => ({ label: st.label, color: st.color, value: tasks.filter((x) => x.status === st.id).length })),
      ];
      return (
        <div className="flex flex-col gap-6">
          <h2 className="ff-display text-[42px] leading-[1.25] pb-1 u-ink">{t("stats")}<span style={{ color: "var(--accent)" }}>.</span></h2>

            <StatCard label={t("projects")} value={projects.length} />

    function ArchiveView({ archive, onDelete }) {
      const { C, t } = useApp();
      return (
        <div className="flex flex-col gap-6">
          <h2 className="ff-display text-[42px] leading-[1.25] pb-1 u-ink">{t("archive")}<span style={{ color: "var(--accent)" }}>.</span></h2>
          {archive.length === 0 ? (
            <div className="rounded-2xl border-2 border-dashed p-8 text-center" style={{ borderColor: "var(--dash)" }}>
              <p className="text-[16.5px] u-sub">{t("archiveEmpty")}</p>
            </div>
          ) : (
            <div className="flex flex-col gap-3">
              {[...archive].reverse().map((w) => (
                <div key={w.id} className="group flex flex-wrap items-center gap-x-4 gap-y-1 rounded-2xl border p-4 on-card" style={{ background: C.card, borderColor: "var(--line)" }}>
                  <span className="ff-display text-[24px] tracking-tight min-w-0 truncate u-ink">{w.label}</span>
                  <span className="text-[15px] u-faint">{t("ended")} {new Date(w.endedAt).toLocaleDateString()}</span>
                  <span className="ml-auto text-[15px] tabular-nums u-sub">{w.done}/{w.total} {t("tasksWord")}</span>
                  <span className="text-[15px] tabular-nums px-2 py-1 rounded-full" style={{ background: "var(--accentSoft)", color: "var(--accent)" }}>{w.pct}%</span>
                  <button
                    onClick={() => onDelete(w.id)}
                    className="opacity-0 group-hover:opacity-100 transition-opacity"
                    style={{ color: "var(--faint)" }}

                    onMouseLeave={(e) => (e.currentTarget.style.color = "var(--faint)")}

                    <Icons.Trash width={13} height={13} />

    /* ============================================================
       KIẾN TRÚC v19 — "Tách Nhập liệu khỏi Xử lý"
       ------------------------------------------------------------
       DỮ LIỆU LÕI: mọi việc là một Task duy nhất nằm trong
       projects[].tasks[] — { id, name, done, days:[0..6], status }.
       Không nhân bản dữ liệu cho từng view.

       HAI LĂNG KÍNH đọc cùng một Task:
         • Kanban  → đọc/ghi trường `status`  (quy trình)
         • Canvas  → đọc/ghi trường `days`    (thời gian)

       BA KHU VỰC:
         • Trái  = Creation. Nơi DUY NHẤT có ô gõ phím.
         • Giữa  = Workspace. Chỉ kéo-thả, không có input.
         • Phải  = AI. Dải icon hẹp, bấm thì trượt ra.
       ============================================================ */

    /* ------------------------------------------------------------------
       MÔ HÌNH SLOT (v22)
       Một Task gốc nằm ở Inbox/Kanban. Mỗi lần đặt nó lên Timetable là
       sinh MỘT slot ĐỘC LẬP: { slotId, day, start, dur, done, color, desc }.
       Nhờ vậy tick buổi thứ Hai không kéo theo buổi thứ Tư.
       Task vẫn giữ `color`/`desc` riêng làm mặc định cho slot sinh sau.
       ------------------------------------------------------------------ */
    const slotsOf = (tk) => tk.slots || [];
    const newSlot = (tk, day, start) => ({
      slotId: uid(),
      day,
      start: clampStart(start ?? tk.start ?? DEFAULT_START),
      dur: tk.dur ?? DEFAULT_DUR,
      done: false,
      color: tk.color || null,
      desc: "",
    });

    /* Task chưa vào lăng kính nào thì nằm ở Inbox */
    const isInInbox = (tk) => !tk.status && slotsOf(tk).length === 0;

    /* Bộ chọn dự phòng cho màn hình cảm ứng: làm thay việc kéo-thả.
       Luôn trả về "" sau mỗi lần chọn — đây là menu HÀNH ĐỘNG, không
       phải ô hiển thị trạng thái, nên không bao giờ giữ giá trị. */
    function PlaceSelect({ onStatus, onDay, onInbox }) {
      const { t, lang } = useApp();
      return (
        <select
          value=""
          draggable={false}
          onMouseDown={(e) => e.stopPropagation()}
          onChange={(e) => {
            const v = e.target.value;
            if (!v) return;
            if (v === "inbox") onInbox && onInbox();
            else if (v.startsWith("s:")) onStatus && onStatus(v.slice(2));
            else if (v.startsWith("d:")) onDay && onDay(Number(v.slice(2)));
            e.target.value = "";
          }}
          className="text-[14px] bg-transparent cursor-pointer shrink-0"
          style={{ color: "var(--faint)", border: "none", outline: "none" }}
          title={t("moveTo")}
        >
          <option value="">⋯</option>
          <optgroup label={t("kanbanTab")}>
            {STATUS.map((s) => (<option key={s.id} value={"s:" + s.id}>{s.label}</option>))}
          </optgroup>
          <optgroup label={t("canvasTab")}>
            {DAYS.map((d, i) => (<option key={d} value={"d:" + i}>{dayName(i, lang)}</option>))}
          </optgroup>
          <option value="inbox">{t("backToInbox")}</option>
        </select>
      );
    }

    /* Một thẻ việc. Dùng chung cho cả ba nơi, khác nhau ở phần đuôi.
       Bọc React.memo: bảng Kanban có thể tới hàng trăm thẻ, sửa một task
       không nên bắt tất cả vẽ lại. */
    const TaskCard = React.memo(function TaskCard({ task, projectName, dragPayload, accentColor, showCheck, onToggle, onRemove, place, compact, onDetails }) {
      const { C, t } = useApp();
      return (
        <div
          draggable
          onDragStart={(e) => {
            e.dataTransfer.setData("text/plain", JSON.stringify(dragPayload));
            e.dataTransfer.effectAllowed = "move";
          }}
          onClick={() => onDetails && onDetails()}
          onContextMenu={(e) => { if (!onDetails) return; e.preventDefault(); onDetails(); }}
          title={task.name + (task.desc ? "\n\n" + task.desc : "")}
          className="group/card rounded-lg border p-2 cursor-pointer on-bg transition-opacity"
          style={{
            /* Có color code → nhuộm cả nền + viền theo màu đó (nền nhạt 16%,
               viền đậm hơn 45%), không còn chỉ mỗi vệt 3px bên trái. Chưa
               gán màu thì giữ nguyên nền/viền trung tính như trước. */
            background: task.color ? hexAlpha(task.color, 0.16) : C.bg,
            borderColor: task.color ? hexAlpha(task.color, 0.45) : "var(--line)",
            borderLeftWidth: "3px",
            borderLeftColor: task.color || accentColor,
            opacity: task.done ? 0.62 : 1,
          }}
        >
          <div className="flex items-start gap-2">
            {showCheck && (
              <span onClick={(e) => e.stopPropagation()} className="shrink-0">
                <Checkbox checked={task.done} onChange={onToggle} />
              </span>
            )}
            <p
              className={"text-[16px] leading-[1.45] flex-1 min-w-0 line-clamp-2 " + (task.done ? "line-through" : "")}
              style={{ color: task.done ? "var(--faint)" : "var(--ink)", overflowWrap: "anywhere" }}
            >
              {task.name}
              {task.desc ? <span className="ml-1 align-middle u-accent">✎</span> : null}
            </p>
            {onRemove && (
              <button
                onClick={(e) => { e.stopPropagation(); onRemove(); }}
                title={t("clearDay")}
                className="opacity-0 group-hover/card:opacity-100 transition-opacity shrink-0"
                style={{ color: "var(--faint)" }}
              >
                <Icons.X width={12} height={12} />
              </button>
            )}
          </div>
          {!compact && (
            <div className="flex items-center justify-between gap-2 mt-1" onClick={(e) => e.stopPropagation()}>
              <span className="text-[14px] font-medium truncate min-w-0 flex-1 u-sub">{projectName}</span>
              {place}
            </div>
          )}
        </div>
      );
    });

    /* ================= CỘT TRÁI — khu Nhập liệu ================= */

    function LeftProject({ project, onAddTask, onDeleteTask, onDeleteProject, onDetails }) {
      const { C, t } = useApp();
      const placed = project.tasks.filter((x) => !isInInbox(x)).length;
      return (
        <div className="group rounded-xl border p-3 on-card" style={{ background: C.card, borderColor: "var(--line)" }}>
          <div className="flex items-center gap-2 mb-1">
            <span className="text-[16px] font-medium tracking-wide flex-1 whitespace-normal break-words leading-[1.4] u-ink">{project.name}</span>
            <span className="text-[14px] tabular-nums u-faint">{placed}/{project.tasks.length}</span>
            <button
              onClick={onDeleteProject}
              className="opacity-0 group-hover:opacity-100 transition-opacity"
              style={{ color: "var(--faint)" }}
              onMouseEnter={(e) => (e.currentTarget.style.color = "var(--accent)")}
              onMouseLeave={(e) => (e.currentTarget.style.color = "var(--faint)")}
            >
              <Icons.Trash width={13} height={13} />
            </button>
          </div>
          {project.tasks.map((tk) => {
            const out = !isInInbox(tk);
            return (
              <div
                key={tk.id}
                onContextMenu={(e) => { e.preventDefault(); onDetails(tk); }}
                className="flex items-start gap-2 py-[3px]"
                style={{ opacity: out ? 0.45 : 1 }}
              >
                <span
                  className="w-1.5 h-1.5 rounded-full shrink-0 mt-[7px]"
                  style={{ background: tk.done ? "#5f7d5a" : (tk.status ? (STATUS.find((s) => s.id === tk.status) || {}).color : (out ? "var(--accent)" : "var(--dash)")) }}
                />
                <span
                  className={"text-[15px] flex-1 whitespace-normal break-words leading-[1.45] " + (tk.done ? "line-through" : "")}
                  style={{ color: tk.done ? "var(--faint)" : "var(--ink)" }}
                >
                  {tk.name}
                  {tk.desc ? <span className="ml-1 u-accent">✎</span> : null}
                </span>
                <button
                  onClick={() => onDeleteTask(tk.id)}
                  className="mt-[3px]"
                  style={{ color: "var(--faint)" }}
                  onMouseEnter={(e) => (e.currentTarget.style.color = "var(--accent)")}
                  onMouseLeave={(e) => (e.currentTarget.style.color = "var(--faint)")}
                >
                  <Icons.X width={11} height={11} />
                </button>
              </div>
            );
          })}
          <AddTaskInput onAdd={onAddTask} />
        </div>
      );
    }

    function InboxPanel({ items, onStatus, onDay, onUnassign, onDetails }) {
      const { C, t } = useApp();
      const [over, setOver] = useState(false);
      return (
        <div
          onDragOver={(e) => { e.preventDefault(); setOver(true); }}
          onDragLeave={() => setOver(false)}
          onDrop={(e) => {
            e.preventDefault(); setOver(false);
            try { const { pid, tid } = JSON.parse(e.dataTransfer.getData("text/plain")); onUnassign(pid, tid); } catch (err) {}
          }}
          className="rounded-xl border-2 p-3 on-card transition-colors"
          style={{
            background: C.card,
            borderColor: over ? "var(--accent)" : "var(--line)",
            borderStyle: over ? "dashed" : "solid",
          }}
        >
          <div className="flex items-center gap-2 mb-2">
            <Micro style={{ color: "var(--sub)" }}>{t("inbox")}</Micro>
            <span className="text-[14px] tabular-nums ml-auto u-faint">{items.length}</span>
          </div>
          {items.length === 0 ? (
            <p className="ff-display italic text-[17px] leading-[1.5] u-faint">{t("inboxEmpty")}</p>
          ) : (
            <div className="flex flex-col gap-2 max-h-[46vh] overflow-y-auto pr-1">
              {items.map((x) => (
                <TaskCard
                  key={x.task.id}
                  task={x.task}
                  projectName={x.pname}
                  dragPayload={{ pid: x.pid, tid: x.task.id }}
                  accentColor={BACKLOG_COLOR}
                  onDetails={() => onDetails(x)}
                  place={<PlaceSelect onStatus={(st) => onStatus(x.pid, x.task.id, st)} onDay={(d) => onDay(x.pid, x.task.id, d)} />}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    function LeftSidebar({
      projects, inbox, addingProject, setAddingProject, newProject, setNewProject,
      submitNewProject, onAddTask, onDeleteTask, onDeleteProject,
      onCopy, onPaste, onStatus, onDay, onUnassign, onDetails,
    }) {
      const { C, t } = useApp();
      return (
        <div className="w-full lg:w-[330px] flex flex-col gap-3 pb-2">
          {/* Hộp việc lên TRƯỚC danh sách dự án: đây là nơi việc mới rơi vào
              và là nguồn để kéo sang Kanban/Canvas, nên phải thấy ngay không
              phải cuộn qua hết các dự án. */}
          <InboxPanel items={inbox} onStatus={onStatus} onDay={onDay} onUnassign={onUnassign} onDetails={onDetails} />

          <div className="flex items-center gap-2 px-1 min-w-0 mt-1 border-t border-dashed pt-3" style={{ borderColor: "var(--dash)" }}>
            <Micro className="truncate min-w-0 u-sub">{t("projects")}</Micro>
            <span className="flex items-center gap-1 ml-auto shrink-0">
              <IconBtn title={t("copyPlan")} onClick={onCopy}><Icons.Copy width={15} height={15} /></IconBtn>
              <IconBtn title={t("pastePlan")} onClick={onPaste}><Icons.Paste width={15} height={15} /></IconBtn>
            </span>
          </div>

          {projects.map((p) => (
            <LeftProject
              key={p.id}
              project={p}
              onAddTask={(name) => onAddTask(p.id, name)}
              onDeleteTask={(tid) => onDeleteTask(p.id, tid)}
              onDeleteProject={() => onDeleteProject(p.id)}
              onDetails={(tk) => onDetails({ task: tk, pid: p.id, pname: p.name })}
            />
          ))}

          {addingProject ? (
            <div className="rounded-xl border-2 border-dashed p-3 on-card" style={{ borderColor: "var(--accent)", background: C.card }}>
              <input
                autoFocus
                value={newProject}
                onChange={(e) => setNewProject(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter") submitNewProject();
                  if (e.key === "Escape") { setAddingProject(false); setNewProject(""); }
                }}
                placeholder={t("projectName")}
                className="w-full bg-transparent text-[16.5px]"
                style={{ color: "var(--ink)" }}
              />
              <div className="flex items-center gap-3 mt-2">
                <button onClick={submitNewProject} className="u-label transition-opacity hover:opacity-80 u-accent">{t("create")}</button>
                <button onClick={() => { setAddingProject(false); setNewProject(""); }} className="u-label u-sub">{t("cancel")}</button>
              </div>
            </div>
          ) : (
            <button
              onClick={() => setAddingProject(true)}
              className="w-full flex items-center justify-center gap-2 rounded-xl border-2 border-dashed py-2.5 u-label transition-colors"
              style={{ borderColor: "var(--dash)", color: "var(--sub)" }}
              onMouseEnter={(e) => { e.currentTarget.style.borderColor = "var(--accent)"; e.currentTarget.style.color = "var(--accent)"; }}
              onMouseLeave={(e) => { e.currentTarget.style.borderColor = "var(--dash)"; e.currentTarget.style.color = "var(--sub)"; }}
            >
              <Icons.Plus width={13} height={13} /> {t("addProject")}
            </button>
          )}
        </div>
      );
    }

    /* ================= KHU GIỮA — lăng kính 1: Kanban ================= */

    function KanbanView({ rows, onSetStatus, onDetails, chart }) {
      const { C, t } = useApp();
      const [overCol, setOverCol] = useState(null);

      const byCol = {};
      STATUS.forEach((s) => { byCol[s.id] = rows.filter((x) => x.task.status === s.id); });

      const dropProps = (colId) => ({
        onDragOver: (e) => { e.preventDefault(); setOverCol(colId); },
        onDragLeave: () => setOverCol((c) => (c === colId ? null : c)),
        onDrop: (e) => {
          e.preventDefault(); setOverCol(null);
          try { const { pid, tid } = JSON.parse(e.dataTransfer.getData("text/plain")); onSetStatus(pid, tid, colId); } catch (err) {}
        },
      });

      return (
        <div className="lg:h-full flex flex-col-reverse xl:flex-row gap-4 items-stretch">
          {/* MÁY TÍNH (lg+): 5 cột nằm CÙNG MỘT HÀNG — bắt buộc để mỗi cột có
             chiều cao xác định (h-full) và tự cuộn dọc RIÊNG bên trong, đúng
             yêu cầu "chỉ cuộn trong từng cột Kanban"; hẹp quá thì cuộn NGANG
             cả dải chứ không vỡ layout như grid-wrap từng làm.
             ĐIỆN THOẠI: xếp chồng DỌC, cao tự nhiên, để cả trang cuộn — nhồi
             5 cột ngang vào màn 375px thì cột nào cũng chỉ còn một mẩu. */}
          <div className="flex-1 min-w-0 lg:h-full flex flex-col lg:flex-row gap-3 lg:overflow-x-auto pb-1">
          {STATUS.map((col) => (
            <div
              key={col.id}
              {...dropProps(col.id)}
              className="min-h-[220px] lg:min-h-0 lg:h-full lg:flex-1 lg:min-w-[220px] rounded-xl border p-3 flex flex-col transition-colors on-card"
              style={{
                background: C.card,
                borderColor: overCol === col.id ? col.color : "var(--line)",
                borderWidth: overCol === col.id ? "2px" : "1px",
              }}
            >
              <div className="shrink-0 flex items-center gap-2 pb-2 border-b border-dashed" style={{ borderColor: "var(--line)" }}>
                <span className="w-2 h-2 rounded-full shrink-0" style={{ background: col.color }} />
                <Micro className="truncate min-w-0 u-sub">{col.label}</Micro>
                <span className="text-[14px] tabular-nums ml-auto shrink-0 u-faint">{byCol[col.id].length}</span>
              </div>
              {/* Vùng cuộn dọc RIÊNG của cột — chỉ phần thẻ việc cuộn,
                 tiêu đề cột luôn đứng yên phía trên. */}
              <div className="flex-1 lg:min-h-0 lg:overflow-y-auto flex flex-col gap-2 pt-2">
                {byCol[col.id].length === 0 ? (
                  <p className="ff-display italic text-[17px] text-center my-auto u-faint">{t("dropHere")}</p>
                ) : (
                  byCol[col.id].map((x) => (
                    <TaskCard
                      key={x.task.id}
                      task={x.task}
                      projectName={x.pname}
                      dragPayload={{ pid: x.pid, tid: x.task.id }}
                      accentColor={col.color}
                      onDetails={() => onDetails(x)}
                      showCheck
                      onToggle={() => onSetStatus(x.pid, x.task.id, x.task.done ? "todo" : "done")}
                    />
                  ))
                )}
              </div>
            </div>
          ))}
          </div>

          {/* Cột tỉ lệ trạng thái — Donut quay lại đúng chỗ cũ */}
          <aside className="w-full xl:w-56 shrink-0 lg:h-full lg:overflow-y-auto rounded-xl border p-4 on-card" style={{ background: C.card, borderColor: "var(--line)" }}>
            <Micro style={{ color: "var(--sub)" }}>{t("statusShare")}</Micro>
            <div className="mt-2"><Donut data={chart} centerLabel={t("tasksWord")} /></div>
            <div className="mt-3 flex flex-col gap-1">
              {chart.map((d) => (
                <div key={d.label} className="flex items-center gap-2 text-[15px] min-w-0">
                  <span className="w-2 h-2 rounded-full shrink-0" style={{ background: d.color }} />
                  <span className="truncate min-w-0 u-sub">{d.label}</span>
                  <span className="ml-auto tabular-nums shrink-0 u-faint">
                    {d.value}{rows.length ? ` · ${Math.round((d.value / rows.length) * 100)}%` : ""}
                  </span>
                </div>
              ))}
            </div>
          </aside>
        </div>
      );
    }

    /* ================= thanh tiến độ dạng bể nước 4 ngăn ================= */

    /* Màu mực nước chạy từ đỏ (0%) qua cam (50%) sang xanh lá (100%).
       0 độ = đỏ, 120 độ = lục, nên nhân pct với 1.2 là ra đúng dải.
       Bão hoà/độ sáng hạ xuống 58%/37% (trước 72%/42%) để mực nước không
       "chói" trên nền hồng trầm của theme — vẫn đủ tương phản để đọc màu
       nhưng trầm hơn, hợp tông với phần còn lại của trang. */
    const tankHue = (pct) => "hsl(" + Math.round(pct * 1.2) + ", 58%, 37%)";

    /* Dựng như một cục pin: thân chữ nhật bo nhẹ + viền đậm, cộng một núm
       nhỏ nhô bên phải (đầu cực dương). Núm là ô riêng ghép cạnh thân
       bằng flex, không lồng vào bên trong để không bị bo góc/che mất. */
    function ProgressTank({ pct, done, total }) {
      const { C, t } = useApp();
      /* Chữ nằm trên phần đã đổ màu thì phải là chữ sáng, nằm ngoài thì
         dùng màu chữ nền. Ngưỡng 52% là lúc mực nước chạm giữa thanh. */
      const onFill = pct >= 52;
      /* Viền dùng accent nhưng pha mờ (alpha 55%) thay vì đặc màu — đặc màu
         nhìn quá đậm/gắt ở bề dày 4px. Alpha trộn với nền phía sau nên
         viền nhạt và mềm hơn mà vẫn giữ đúng tông accent của theme. */
      const borderTint = hexAlpha(C.accent, 0.55);
      return (
        <div className="flex items-center h-12 sm:h-14 lg:h-16 w-full max-w-xl shrink-0" title={done + "/" + total}>
          <div
            className="relative h-full flex-1 min-w-0 rounded-lg lg:rounded-xl overflow-hidden border-[3px] lg:border-[4px]"
            style={{ background: "var(--accentSoft)", borderColor: borderTint }}
          >
            <div
              className="absolute inset-y-0 left-0 transition-all duration-700 ease-out"
              style={{ width: pct + "%", background: tankHue(pct) }}
            />
            {[25, 50, 75].map((x) => (
              <span key={x} className="tank-divider" style={{ left: x + "%" }} />
            ))}
            <div className="absolute inset-0 flex items-center justify-center gap-2 pointer-events-none">
              <span className={"ff-display text-[22px] sm:text-[26px] lg:text-[30px] leading-none tabular-nums " + (onFill ? "u-on-fill" : "")} style={onFill ? undefined : { color: "var(--ink)" }}>
                {pct}%
              </span>
              <span className={"text-[13px] sm:text-[15px] lg:text-[16px] tabular-nums " + (onFill ? "u-on-fill" : "")} style={onFill ? undefined : { color: "var(--sub)" }}>
                {done}/{total}
              </span>
            </div>
          </div>
          {/* núm cực dương của pin — cùng độ mờ với viền cho đồng bộ */}
          <div className="h-4 w-[8px] lg:h-6 lg:w-[10px] rounded-r-md lg:rounded-r-lg shrink-0" style={{ background: borderTint }} />
        </div>
      );
    }

    /* ================= modal chi tiết =================
       Hai chế độ:
         • entry.slot có   → sửa RIÊNG buổi đó (giờ, thời lượng, màu, ghi chú, xong)
         • entry.slot không → sửa Task gốc (tên, màu mặc định, ghi chú chung, danh sách buổi)
       ================================================= */

    function ColorRow({ value, onPick, labels }) {
      const { C, t } = useApp();
      return (
        <div className="flex flex-wrap items-center gap-2 mt-2">
          {TASK_COLORS.map((c) => {
            const on = value === c.hex;
            return (
              <button
                key={c.id}
                onClick={() => onPick(on ? null : c.hex)}
                title={labels[c.id]}
                className="w-8 h-8 rounded-full transition-transform"
                style={{
                  background: c.hex,
                  transform: on ? "scale(1.15)" : "none",
                  border: "2px solid " + (on ? "var(--ink)" : C.card),
                }}
              />
            );
          })}
          {value && (
            <span className="flex items-center gap-2 ml-1">
              <span className="text-[15px] u-sub">
                {(TASK_COLORS.find((c) => c.hex === value) || {}).id ? labels[(TASK_COLORS.find((c) => c.hex === value) || {}).id] : ""}
              </span>
              <button onClick={() => onPick(null)} className="text-[14px] underline underline-offset-4 u-faint">
                {t("colorReset")}
              </button>
            </span>
          )}
        </div>
      );
    }

    function TaskModal({ entry, colorLabels, onClose, onRenameTask, onPatchTask, onPatchSlot, onToggleTaskDone, onToggleSlotDone, onAddSlot, onMoveSlotDay, onDeleteSlot, onDeleteTask, onOpenSlot, onAiTrigger }) {
      const { C, t, lang } = useApp();
      if (!entry) return null;
      const tk = entry.task;
      const sl = entry.slot || null;
      const target = sl || tk;                       // đối tượng đang được sửa
      const start = sl ? sl.start : (tk.start ?? DEFAULT_START);
      const dur = sl ? sl.dur : (tk.dur ?? DEFAULT_DUR);
      const desc = target.desc || "";
      const words = desc.trim() ? desc.trim().split(/\s+/).length : 0;
      const PRESETS = [30, 45, 60, 90, 120, 180, 240];
      const patch = (o) => (sl ? onPatchSlot(o) : onPatchTask(o));
      const slots = slotsOf(tk);

      return (
        <>
          <div className="fixed inset-0 z-[70] bg-black/30" onClick={onClose} />
          <div
            className="fixed z-[75] left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[min(640px,94vw)] max-h-[90vh] overflow-y-auto rounded-2xl border p-5 md:p-6 on-card shadow-2xl"
            style={{ background: C.card, borderColor: "var(--line)" }}
          >
            {/* tên việc (luôn sửa trên Task gốc) */}
            <div className="flex items-start gap-3">
              <div className="flex-1 min-w-0">
                <Micro style={{ color: "var(--faint)" }}>
                  {entry.pname}{sl ? " · " + t("slotOf") + " " + dayName(sl.day, lang) : ""}
                </Micro>
                <input
                  value={tk.name}
                  onChange={(e) => onRenameTask(e.target.value)}
                  className="w-full mt-1 ff-display text-[30px] leading-[1.25] bg-transparent border-b pb-1"
                  style={{ color: "var(--ink)", borderColor: "var(--line)" }}
                />
              </div>
              <button onClick={onClose} className="p-1 shrink-0 u-faint" title={t("close")}>
                <Icons.X width={18} height={18} />
              </button>
            </div>

            {/* mã màu */}
            <div className="mt-5">
              <span className="flex items-baseline gap-2">
                <Micro style={{ color: "var(--sub)" }}>{t("colorCode")}</Micro>
                <span className="text-[13px] u-faint">{sl ? t("slotWide") : t("taskWide")}</span>
              </span>
              <ColorRow value={target.color || null} onPick={(hex) => patch({ color: hex })} labels={colorLabels} />
            </div>

            {sl ? (
              /* ---------- chế độ BUỔI ---------- */
              <div className="mt-5">
                <Micro style={{ color: "var(--sub)" }}>{t("daysL")}</Micro>
                <div className="flex flex-wrap gap-1 mt-2">
                  {DAYS.map((_, i) => {
                    const on = sl.day === i;
                    return (
                      <button
                        key={DAYS[i]}
                        onClick={() => onMoveSlotDay(i)}
                        className="px-3 py-1.5 rounded-lg text-[14px] font-medium transition-colors"
                        style={{
                          background: on ? "var(--accentFill)" : "transparent",
                          color: on ? "var(--accentInk)" : "var(--sub)",
                          border: "1px solid var(--line)",
                        }}
                      >
                        {dayName(i, lang)}
                      </button>
                    );
                  })}
                </div>
              </div>
            ) : (
              /* ---------- chế độ TASK: danh sách buổi ---------- */
              <div className="mt-5">
                <Micro style={{ color: "var(--sub)" }}>{t("slotsL")}</Micro>
                {slots.length === 0 ? (
                  <p className="ff-display italic text-[17px] mt-1 u-faint">{t("noSlots")}</p>
                ) : (
                  <div className="flex flex-col gap-1 mt-2">
                    {[...slots].sort((a, b) => a.day - b.day || a.start - b.start).map((x) => (
                      <div key={x.slotId} className="flex items-center gap-3 rounded-lg border px-3 py-1.5" style={{ borderColor: "var(--line)" }}>
                        <span className="w-2 h-2 rounded-full shrink-0" style={{ background: x.color || tk.color || "var(--accentFill)" }} />
                        <button onClick={() => onOpenSlot(x.slotId)} className="text-[15px] tabular-nums text-left flex-1 min-w-0 truncate" style={{ color: x.done ? "var(--faint)" : "var(--ink)", textDecoration: x.done ? "line-through" : "none" }}>
                          {dayName(x.day, lang)} · {hhmm(x.start)}–{hhmm(x.start + x.dur)}
                        </button>
                        <span onClick={(e) => e.stopPropagation()}>
                          <Checkbox checked={x.done} onChange={() => onToggleSlotDone(x.slotId)} />
                        </span>
                        <button onClick={() => onDeleteSlot(x.slotId)} style={{ color: "var(--faint)" }} title={t("deleteSlot")}>
                          <Icons.X width={13} height={13} />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
                <div className="flex flex-wrap items-center gap-2 mt-3">
                  <Micro style={{ color: "var(--faint)" }}>{t("addSlot")}</Micro>
                  {DAYS.map((_, i) => (
                    <button
                      key={DAYS[i]}
                      onClick={() => onAddSlot(i)}
                      className="px-2.5 py-1 rounded-lg text-[14px] font-medium transition-colors"
                      style={{ border: "1px solid var(--line)", color: "var(--sub)" }}
                    >
                      {dayName(i, lang)}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* giờ + thời lượng */}
            <div className="flex flex-wrap items-end gap-5 mt-5">
              <label className="flex flex-col gap-2">
                <Micro style={{ color: "var(--sub)" }}>{t("startAt")}</Micro>
                <input
                  type="time"
                  step="900"
                  value={hhmm(start)}
                  onChange={(e) => patch({ start: clampStart(minsOf(e.target.value)) })}
                  className="rounded-lg border px-3 py-2 text-[18px] bg-transparent tabular-nums"
                  style={{ borderColor: "var(--line)", color: "var(--ink)" }}
                />
              </label>
              <label className="flex flex-col gap-2">
                <Micro style={{ color: "var(--sub)" }}>{t("durationL")}</Micro>
                <span className="flex items-center gap-2">
                  <input
                    type="number" min="15" max="720" step="15"
                    value={dur}
                    onChange={(e) => patch({ dur: Math.max(15, Math.min(720, Number(e.target.value) || 15)) })}
                    className="w-24 rounded-lg border px-3 py-2 text-[18px] bg-transparent tabular-nums"
                    style={{ borderColor: "var(--line)", color: "var(--ink)" }}
                  />
                  <span className="text-[15px] u-sub">{t("minutes")}</span>
                </span>
              </label>
              <span className="text-[15px] tabular-nums pb-2 u-faint">
                {hhmm(start)} – {hhmm(Math.min(24 * 60, start + dur))}
              </span>
            </div>
            <div className="flex flex-wrap gap-2 mt-3">
              {PRESETS.map((m) => (
                <button
                  key={m}
                  onClick={() => patch({ dur: m })}
                  className="rounded-full px-3 py-1 text-[14px] tabular-nums transition-colors"
                  style={{
                    background: dur === m ? "var(--accentFill)" : "transparent",
                    color: dur === m ? "var(--accentInk)" : "var(--sub)",
                    border: "1px solid var(--line)",
                  }}
                >
                  {m < 60 ? m + "′" : (m / 60) + "h"}
                </button>
              ))}
            </div>

            {/* ghi chú */}
            <div className="mt-5">
              <span className="flex items-baseline gap-2">
                <Micro style={{ color: "var(--sub)" }}>{t("notesL")}</Micro>
                <span className="text-[13px] u-faint">{sl ? t("slotWide") : t("taskWide")}</span>
              </span>
              <textarea
                value={desc}
                onChange={(e) => patch({ desc: e.target.value })}
                placeholder={t("notePh")}
                rows={8}
                className="w-full mt-2 rounded-xl border p-3 bg-transparent text-[16px] leading-[1.6] resize-y overflow-y-auto"
                style={{ borderColor: "var(--line)", color: "var(--ink)", maxHeight: "38vh" }}
              />
              <div className="flex items-center justify-between mt-1">
                <span className="text-[14px] tabular-nums" style={{ color: words > 350 ? "var(--accent)" : "var(--faint)" }}>
                  {words} / 350 {t("wordsWord")}
                </span>
                <button
                  onClick={() => (sl ? onDeleteSlot(sl.slotId) : onDeleteTask())}
                  className="text-[14px] underline underline-offset-4"
                  style={{ color: "var(--faint)" }}
                >
                  {sl ? t("deleteSlot") : t("deleteTask")}
                </button>
              </div>
            </div>

            {/* chân modal */}
            <div className="flex flex-wrap items-center gap-3 pt-4 mt-5 border-t border-dashed" style={{ borderColor: "var(--line)" }}>
              <button
                onClick={() => (sl ? onToggleSlotDone(sl.slotId) : onToggleTaskDone())}
                className="flex items-center gap-2 u-label transition-opacity hover:opacity-80"
                style={{ color: target.done ? "var(--accent)" : "var(--sub)" }}
              >
                <Checkbox checked={!!target.done} onChange={() => (sl ? onToggleSlotDone(sl.slotId) : onToggleTaskDone())} /> {t("markDone")}
              </button>

              <span className="ml-auto flex items-center gap-2">
                <Micro className="!text-[12px] !tracking-[0.06em] u-faint">{t("aiTriggers")}</Micro>
                {AI_TRIGGERS.map((a) => (
                  <button
                    key={a.id}
                    onClick={() => onAiTrigger(a)}
                    title={a.name[lang]}
                    className="flex items-center justify-center w-9 h-9 rounded-lg text-[18px] transition-colors"
                    style={{ background: "var(--accentSoft)" }}
                  >
                    {a.icon}
                  </button>
                ))}
              </span>
            </div>
          </div>
        </>
      );
    }

    /* ================= KHU GIỮA — lăng kính 2: Timetable ================= */

    const TimeBlock = React.memo(function TimeBlock({ entry, onOpen, onToggleDone }) {
      const { t } = useApp();
      const sl = entry.slot;
      const tk = entry.task;
      const top = ((sl.start - HOUR_START * 60) / 60) * ROW_H;
      const height = Math.max(22, (sl.dur / 60) * ROW_H - 3);
      const base = sl.done
        ? "#5f7d5a"
        : (sl.color || tk.color || (tk.status ? (STATUS.find((x) => x.id === tk.status) || {}).color : "var(--accentFill)"));
      const roomy = height >= 52;
      return (
        <div
          draggable
          onDragStart={(e) => {
            e.dataTransfer.setData("text/plain", JSON.stringify({ pid: entry.pid, tid: tk.id, slotId: sl.slotId }));
            e.dataTransfer.effectAllowed = "move";
          }}
          onClick={() => onOpen()}
          onContextMenu={(e) => { e.preventDefault(); onOpen(); }}
          title={tk.name + " · " + hhmm(sl.start) + "–" + hhmm(sl.start + sl.dur) + (sl.desc ? "\n\n" + sl.desc : "")}
          className="absolute rounded-md px-1.5 py-1 overflow-hidden cursor-pointer transition-opacity"
          style={{
            top: top + "px",
            height: height + "px",
            left: "calc(" + (entry.lane / entry.lanes) * 100 + "% + 2px)",
            width: "calc(" + (100 / entry.lanes) + "% - 4px)",
            background: base,
            color: "var(--accentInk)",
            opacity: sl.done ? 0.55 : 1,
            borderLeft: sl.desc ? "3px solid rgba(255,255,255,.85)" : "none",
          }}
        >
          <div className="flex items-start gap-1">
            <button
              onClick={(e) => { e.stopPropagation(); onToggleDone(); }}
              className="shrink-0 mt-[1px] w-[13px] h-[13px] rounded-[3px] border flex items-center justify-center"
              style={{ borderColor: "rgba(255,255,255,.8)", background: sl.done ? "rgba(255,255,255,.9)" : "transparent" }}
              title={t("markDone")}
            >
              {sl.done && <Icons.Check width={9} height={9} strokeWidth={4} style={{ color: base }} />}
            </button>
            <span className="text-[11px] tabular-nums leading-none mt-[2px] opacity-90">{hhmm(sl.start)}</span>
          </div>
          <p
            className={(roomy ? "line-clamp-2 " : "line-clamp-1 ") + "text-[12.5px] leading-[1.28] mt-[3px] " + (sl.done ? "line-through" : "")}
            style={{ overflowWrap: "anywhere" }}
          >
            {tk.name}
          </p>
        </div>
      );
    });

    function CanvasView({ slotRows, isCurrentWeek, onAssignSlot, onMoveSlot, onToggleSlotDone, onOpen }) {
      const { C, t, lang } = useApp();
      const [overDay, setOverDay] = useState(null);
      const todayIdx = isCurrentWeek ? (new Date().getDay() + 6) % 7 : -1;

      /* Lưới nay đủ 24 giờ nên mở ra là đứng ở 0:00 — toàn khoảng trống ban
         đêm. Cuộn sẵn tới trước giờ hiện tại 1 tiếng để mở lên thấy ngay
         vùng đang dùng. Chỉ chạy một lần lúc mở tab Canvas. */
      const scrollRef = useRef(null);
      useEffect(() => {
        if (!scrollRef.current) return;
        const target = Math.max(0, (new Date().getHours() - 1 - HOUR_START) * ROW_H);
        scrollRef.current.scrollTop = target;
      }, []);

      const minutesFromEvent = (e, el) => {
        const box = el.getBoundingClientRect();
        const y = e.clientY - box.top;
        const raw = HOUR_START * 60 + (y / ROW_H) * 60;
        return clampStart(Math.round(raw / 15) * 15);
      };

      const dropProps = (i) => ({
        onDragOver: (e) => { e.preventDefault(); setOverDay(i); },
        onDragLeave: () => setOverDay((d) => (d === i ? null : d)),
        onDrop: (e) => {
          e.preventDefault(); setOverDay(null);
          try {
            const data = JSON.parse(e.dataTransfer.getData("text/plain"));
            const mins = minutesFromEvent(e, e.currentTarget);
            if (data.slotId) onMoveSlot(data.pid, data.tid, data.slotId, i, mins);
            else onAssignSlot(data.pid, data.tid, i, mins);
          } catch (err) {}
        },
      });

      return (
        <div className="lg:h-full flex flex-col rounded-2xl border overflow-x-auto on-card" style={{ background: C.card, borderColor: "var(--line)" }}>
          {/* Header và lưới giờ phải nằm CHUNG một khối cuộn dọc (overflow-y-auto)
              bên dưới. Trước đây header đứng ngoài, lưới giờ đứng trong — khi lưới
              đủ cao để tự sinh thanh cuộn dọc, thanh cuộn chiếm mất vài px bề rộng
              của riêng nó, nên 2 khối tính lại cột `1fr` trên hai bề rộng khác nhau
              và các cột ngày bị lệch dần sang phải. Header nằm cùng khối thì luôn
              bị trừ bề rộng giống hệt lưới giờ, cột nào cũng khớp cột nấy.
              MÁY TÍNH: flex-1 min-h-0 để lưới chiếm trọn chiều cao còn lại của
              khung app-shell. ĐIỆN THOẠI: khung không bị khoá 100vh nên phải
              tự chốt maxHeight 62vh, không thì lưới 24 giờ dài ~1100px đẩy
              footer văng khỏi tầm với. */}
          <div ref={scrollRef} className="overflow-y-auto max-h-[62vh] lg:max-h-none lg:flex-1 lg:min-h-0">
            {/* min-w-max: lưới phải rộng đúng bằng nội dung (642px) thay vì bị
                bó theo khung 342px — vùng "được phép ghim" của cột giờ chính
                là bề rộng lưới này, bó hẹp thì ghim hụt ~12px cuối khi cuộn
                sang phải hết cỡ. Trên máy tính lưới vẫn giãn đầy như cũ. */}
            <div className="grid min-w-max sticky top-0 z-20 border-b" style={{ gridTemplateColumns: CANVAS_COLS, background: C.card, borderColor: "var(--line)" }}>
              {/* Ô góc: ghim cả hai chiều nên luôn che đúng giao điểm giữa
                  hàng thứ (sticky top) và cột giờ (sticky left). z cao nhất
                  để không bị nhãn giờ trượt qua bên dưới nó. */}
              <div className="sticky left-0 z-30" style={{ background: C.card }} />
              {DAYS.map((_, i) => {
                const isToday = i === todayIdx;
                return (
                  <div
                    key={DAYS[i]}
                    className="flex items-center justify-center py-2 border-l"
                    style={{
                      borderColor: "var(--line)",
                      /* Hôm nay: viền dưới đậm màu accent thay cho số ngày đã bỏ —
                         luôn chiếm 3px kể cả lúc không phải hôm nay (viền trong
                         suốt) để chiều cao hàng không nhảy giữa các cột. */
                      borderBottom: isToday ? "3px solid var(--accent)" : "3px solid transparent",
                    }}
                  >
                    <Micro style={{ color: isToday ? "var(--accent)" : "var(--sub)" }}>{dayName(i, lang)}</Micro>
                  </div>
                );
              })}
            </div>

            {/* paddingTop 8px: nhãn "00:00" bị đẩy lên -7px để canh giữa
                đúng vạch kẻ đầu tiên, không có đệm thì vọt ra ngoài rìa
                trên và bị cắt. Đệm áp cho CẢ khối (cột giờ lẫn 7 cột ngày)
                nên vạch kẻ giờ trong từng cột ngày vẫn khớp đúng nhãn. */}
            <div className="grid min-w-max relative" style={{ gridTemplateColumns: CANVAS_COLS, paddingTop: "8px" }}>
              {/* Cột giờ GHIM TRÁI: màn hẹp không đủ chỗ cho cả 7 ngày nên
                  phải cuộn ngang — không ghim thì cột giờ trôi mất, xem T6/CN
                  là không còn biết khối việc rơi vào giờ nào. */}
              <div className="relative sticky left-0 z-10" style={{ height: HOURS.length * ROW_H + "px", background: C.card }}>
                {HOURS.map((h, idx) => (
                  <div key={h} className="absolute right-2 text-[12.5px] tabular-nums" style={{ top: idx * ROW_H - 7 + "px", color: "var(--faint)" }}>
                    {String(h).padStart(2, "0")}:00
                  </div>
                ))}
              </div>
